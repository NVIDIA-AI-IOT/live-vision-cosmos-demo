# install to /etc/sysctl.d/99-live-vision-cosmos-demo-swap.conf
#
# Default vm.swappiness on this image is 60, which is aggressive for a box whose single largest
# allocation is a model that must stay resident. 10 still allows swap as a safety valve under real
# pressure but stops the kernel trading resident anon pages for page cache by preference.
vm.swappiness=10
